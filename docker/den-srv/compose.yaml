name: rusty-eva

services:
  rusty-view:
    image: ${RUSTY_EVA_IMAGE}
    init: true
    restart: unless-stopped
    env_file:
      - ./config/service.env
    environment:
      HOME: /tmp
    ports:
      - '${RUSTY_EVA_PORT}:9347'
    volumes:
      - type: bind
        source: ./config
        target: /srv/rusty-eva/config
      - type: bind
        source: ./data
        target: /srv/rusty-eva/data
      - type: bind
        source: ./run
        target: /srv/rusty-eva/run
      - type: bind
        source: ./logs
        target: /srv/rusty-eva/logs
      - type: bind
        source: ./artifacts
        target: /srv/rusty-eva/artifacts
      - type: bind
        source: ./backups
        target: /srv/rusty-eva/backups
      - type: bind
        source: ./workspace
        target: /workspace
      - type: bind
        source: ./site
        target: /opt/rusty-view/site
        read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:9347/v1/admin/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
