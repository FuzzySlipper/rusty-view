<div
  class="rv-message"
  data-testid="message-row"
  [attr.data-message-id]="message().id"
  [attr.data-message-role]="message().author.role"
  [attr.data-message-status]="message().status"
  [class]="roleClass()"
  [class.rv-message--decorated]="decoration().className !== undefined"
  [class.rv-message--search-match]="searchMatched()"
  [class.rv-message--search-active]="searchActive()"
>
  <header class="rv-message__header">
    <span class="rv-message__author" data-testid="message-author"
      >{{ authorLabel() }}</span
    >
    <time
      class="rv-message__timestamp"
      data-testid="message-timestamp"
      [attr.datetime]="message().createdAt"
      >{{ timestampLabel() }}</time
    >
    <span class="rv-message__id" data-testid="message-id"
      >{{ message().id }}</span
    >
    @if (statusIndicator()) {
    <span class="rv-message__status" data-testid="message-status"
      >{{ statusIndicator() }}</span
    >
    }
  </header>

  @if (decoration().prefix) {
  <div class="rv-message__prefix">{{ decoration().prefix }}</div>
  }

  <div class="rv-message__blocks" data-testid="message-blocks">
    @for (block of message().blocks; track block.id) {
    <rv-message-block
      [block]="block"
      [message]="message()"
      [searchQuery]="searchQuery()"
      [searchMatched]="matchedBlockIds().has(block.id)"
    />
    }
  </div>

  @if (decoration().suffix) {
  <div class="rv-message__suffix">{{ decoration().suffix }}</div>
  }
</div>
