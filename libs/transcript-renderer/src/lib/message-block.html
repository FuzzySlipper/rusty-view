@if (tool(); as tool) {
<div class="rv-block rv-block--tool" [attr.data-status]="tool.status">
  <button
    type="button"
    class="rv-block__header rv-block__tool-header"
    (click)="toggleExpand()"
    [attr.aria-expanded]="expanded()"
    [disabled]="!hasDetail()"
  >
    <span class="rv-block__disclosure" aria-hidden="true"
      >{{ expanded() ? '▾' : '▸' }}</span
    >
    <span class="rv-block__tool-name">{{ tool.name }}</span>
    <span class="rv-block__tool-status" [attr.data-status]="tool.status"
      >{{ tool.status }}</span
    >
    <span class="rv-block__tool-summary">{{ tool.summary }}</span>
  </button>
  @if (expanded() && hasDetail()) {
  <pre class="rv-block__content">{{ block().content }}</pre>
  }
</div>
} @else if (isCollapsible()) {
<div
  class="rv-block rv-block--collapsible"
  [class.rv-block--debug]="block().kind === 'debug'"
>
  <button
    type="button"
    class="rv-block__header"
    (click)="toggleExpand()"
    [attr.aria-expanded]="expanded()"
  >
    <span class="rv-block__kind">{{ block().kind }}</span>
    @if (isTruncated()) {
    <span class="rv-block__expand">expand</span>
    }
  </button>
  <pre class="rv-block__content">{{ displayContent() }}</pre>
</div>
} @else {
<div class="rv-block rv-block--text">
  @if (shouldRenderFormatted() && renderedHtml()) {
  <div class="rv-block__markdown" [innerHTML]="renderedHtml()"></div>
  } @else {
  <p class="rv-block__content">{{ block().content }}</p>
  }
  @if (showRawToggle()) {
  <div class="rv-block__raw-toggle">
    <button
      type="button"
      class="rv-block__raw-button"
      (click)="toggleRaw()"
      [attr.aria-pressed]="showRaw()"
      tabindex="0"
      (keydown.enter)="toggleRaw()"
      (keydown.space)="$event.preventDefault(); toggleRaw()"
    >
      {{ showRaw() ? 'Formatted' : 'Raw' }}
    </button>
  </div>
  }
</div>
}
