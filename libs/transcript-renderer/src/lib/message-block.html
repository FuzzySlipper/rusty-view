@if (isCollapsible()) {
<div
  class="rv-block rv-block--collapsible"
  [class.rv-block--debug]="block().kind === 'debug'"
>
  <button
    type="button"
    class="rv-block__header"
    (click)="toggleExpand()"
    [attr.aria-expanded]="expanded()"
  >
    <span class="rv-block__kind">{{ block().kind }}</span>
    @if (isTruncated()) {
    <span class="rv-block__expand">expand</span>
    }
  </button>
  <pre class="rv-block__content">{{ displayContent() }}</pre>
</div>
} @else {
<div class="rv-block rv-block--text">
  @if (renderedHtml()) {
  <div class="rv-block__markdown" [innerHTML]="renderedHtml()"></div>
  } @else {
  <p class="rv-block__content">{{ displayContent() }}</p>
  }
</div>
}
