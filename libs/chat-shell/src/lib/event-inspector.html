<div class="rv-event-inspector" data-testid="event-inspector">
  <div class="rv-event-inspector__list" data-testid="event-inspector-list">
    @for (event of events(); track event.event_id) {
    <button
      type="button"
      class="rv-event"
      data-testid="event-row"
      [attr.data-event-id]="event.event_id"
      [attr.data-event-kind]="event.kind"
      [class.rv-event--selected]="selectedEventId() === event.event_id"
      (click)="selectEvent.emit(event.event_id)"
    >
      <span class="rv-event__seq">{{ event.sequence_id }}</span>
      <span
        class="rv-event__kind"
        [class]="kindColor[event.kind] ?? 'rv-event-kind--unknown'"
      >
        {{ event.kind }}
      </span>
      <span class="rv-event__id">{{ event.event_id }}</span>
    </button>
    } @empty {
    <div class="rv-event-inspector__empty" data-testid="event-inspector-empty">
      No events yet.
    </div>
    }
  </div>
  @if (selectedEvent(events()); as selected) {
  <div class="rv-event-inspector__detail" data-testid="event-inspector-detail">
    <rv-json-inspector [data]="selected" />
  </div>
  }
</div>
