<div
  class="rv-top-menu-host"
  data-testid="top-menu"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel($event)"
>
  <rv-top-menu-bar [items]="entries()" (selected)="onSelect($event)" />

  @if (optionsOpen()) {
  <div
    class="rv-top-menu__overlay"
    data-testid="top-menu-overlay-options"
    role="button"
    tabindex="0"
    aria-label="Close options"
    (click)="onOverlayClick($event)"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      data-testid="top-menu-panel-options"
      role="dialog"
      aria-label="Options"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <rv-options-panel (dismissed)="closePanel()" />
    </div>
  </div>
  } @if (helpOpen()) {
  <div
    class="rv-top-menu__overlay"
    data-testid="top-menu-overlay-help"
    role="button"
    tabindex="0"
    aria-label="Close help"
    (click)="onOverlayClick($event)"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel rv-top-menu__panel--wide"
      data-testid="top-menu-panel-help"
      role="dialog"
      aria-label="Help"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <header class="rv-top-menu__panel-header">
        <span>Commands</span>
        <button
          type="button"
          class="rv-top-menu__panel-close"
          data-testid="top-menu-panel-close"
          (click)="closePanel()"
        >
          ✕
        </button>
      </header>
      <rv-help-panel />
    </div>
  </div>
  } @if (sessionsOpen()) {
  <div
    class="rv-top-menu__overlay"
    data-testid="top-menu-overlay-sessions"
    role="button"
    tabindex="0"
    aria-label="Close sessions"
    (click)="onOverlayClick($event)"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      data-testid="top-menu-panel-sessions"
      role="dialog"
      aria-label="Sessions"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <rv-sessions-panel (dismissed)="closePanel()" />
    </div>
  </div>
  } @if (profilesOpen()) {
  <div
    class="rv-top-menu__overlay"
    data-testid="top-menu-overlay-profiles"
    role="button"
    tabindex="0"
    aria-label="Close profiles"
    (click)="onOverlayClick($event)"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      data-testid="top-menu-panel-profiles"
      role="dialog"
      aria-label="Profiles"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <rv-admin-profiles-panel (dismissed)="closePanel()" />
    </div>
  </div>
  } @if (serviceOpen()) {
  <div
    class="rv-top-menu__overlay"
    data-testid="top-menu-overlay-service"
    role="button"
    tabindex="0"
    aria-label="Close service config"
    (click)="onOverlayClick($event)"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      data-testid="top-menu-panel-service"
      role="dialog"
      aria-label="Service Config"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <rv-admin-service-panel (dismissed)="closePanel()" />
    </div>
  </div>
  } @if (debugOpen()) {
  <div
    class="rv-top-menu__overlay"
    data-testid="top-menu-overlay-debug"
    role="button"
    tabindex="0"
    aria-label="Close debug"
    (click)="onOverlayClick($event)"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel rv-top-menu__panel--debug"
      data-testid="top-menu-panel-debug"
      role="dialog"
      aria-label="Debug"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <rv-debug-panel />
    </div>
  </div>
  } @if (providersOpen()) {
  <div
    class="rv-top-menu__overlay"
    data-testid="top-menu-overlay-providers"
    role="button"
    tabindex="0"
    aria-label="Close providers"
    (click)="onOverlayClick($event)"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      data-testid="top-menu-panel-providers"
      role="dialog"
      aria-label="Model Providers"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <rv-admin-providers-panel (dismissed)="closePanel()" />
    </div>
  </div>
  } @if (activeCustomPanel(); as customPanel) {
  <div
    class="rv-top-menu__overlay"
    data-testid="top-menu-overlay-custom"
    role="button"
    tabindex="0"
    [attr.aria-label]="'Close ' + customPanel.title"
    (click)="onOverlayClick($event)"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel rv-top-menu__panel--custom"
      [class.rv-top-menu__panel--wide]="customPanel.width === 'wide'"
      data-testid="top-menu-panel-custom"
      role="dialog"
      [attr.aria-label]="customPanel.title"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <header class="rv-top-menu__panel-header">
        <span>{{ customPanel.title }}</span>
        <button
          type="button"
          class="rv-top-menu__panel-close"
          data-testid="top-menu-panel-close"
          (click)="closePanel()"
        >
          ✕
        </button>
      </header>
      <ng-container *ngComponentOutlet="customPanel.component" />
    </div>
  </div>
  }
</div>
