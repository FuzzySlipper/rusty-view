<div class="rv-top-menu-host">
  <rv-top-menu-bar [items]="entries()" (selected)="onSelect($event)" />

  @if (optionsOpen()) {
  <div
    class="rv-top-menu__overlay"
    role="button"
    tabindex="0"
    aria-label="Close options"
    (click)="closePanel()"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      role="dialog"
      aria-label="Options"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <rv-options-panel (dismissed)="closePanel()" />
    </div>
  </div>
  } @if (helpOpen()) {
  <div
    class="rv-top-menu__overlay"
    role="button"
    tabindex="0"
    aria-label="Close help"
    (click)="closePanel()"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel rv-top-menu__panel--wide"
      role="dialog"
      aria-label="Help"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <header class="rv-top-menu__panel-header">
        <span>Commands</span>
        <button
          type="button"
          class="rv-top-menu__panel-close"
          (click)="closePanel()"
        >
          ✕
        </button>
      </header>
      <rv-help-panel />
    </div>
  </div>
  } @if (sessionsOpen()) {
  <div
    class="rv-top-menu__overlay"
    role="button"
    tabindex="0"
    aria-label="Close sessions"
    (click)="closePanel()"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      role="dialog"
      aria-label="Sessions"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <rv-sessions-panel (dismissed)="closePanel()" />
    </div>
  </div>
  } @if (profilesOpen()) {
  <div
    class="rv-top-menu__overlay"
    role="button"
    tabindex="0"
    aria-label="Close profiles"
    (click)="closePanel()"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      role="dialog"
      aria-label="Profiles"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <rv-admin-profiles-panel (dismissed)="closePanel()" />
    </div>
  </div>
  } @if (serviceOpen()) {
  <div
    class="rv-top-menu__overlay"
    role="button"
    tabindex="0"
    aria-label="Close service config"
    (click)="closePanel()"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel()"
  >
    <div
      class="rv-top-menu__panel"
      role="dialog"
      aria-label="Service Config"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <rv-admin-service-panel (dismissed)="closePanel()" />
    </div>
  </div>
  }
</div>
