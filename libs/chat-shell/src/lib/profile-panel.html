<div class="rv-profiles" data-testid="profile-panel">
  <div class="rv-profiles__header">Profiles</div>

  @if (!hasProfiles()) {
  <div class="rv-profiles__empty">
    No profiles found. Click refresh or check the backend.
  </div>
  } @else {
  <ul class="rv-profiles__list">
    @for (profile of profiles(); track profile.profileId) {
    <li>
      <button
        type="button"
        class="rv-profile"
        data-testid="profile-row"
        [attr.data-profile-id]="profile.profileId"
        [attr.data-profile-status]="profile.status"
        [attr.data-active-session-id]="profile.activeSessionId"
        [class.rv-profile--selected]="selectedProfileId() === profile.profileId"
        (click)="onSelectProfile(profile.profileId)"
      >
        <span class="rv-profile__name">{{ profile.label }}</span>
        <span class="rv-profile__meta">
          <span
            class="rv-profile__status"
            [class.rv-profile__status--active]="profile.status === 'active'"
            [class.rv-profile__status--idle]="profile.status === 'idle'"
            [class.rv-profile__status--archived]="profile.status === 'archived'"
            >{{ profile.status }}</span
          >
          · {{ profile.sessionCount }} session(s)
        </span>
        @if (profile.activeSessionId) {
        <span class="rv-profile__live">▸ {{ profile.activeSessionId }}</span>
        }
        <span class="rv-profile__timeout">{{ wakeTimeoutLabel(profile) }}</span>
        @if (admin.profilePauseCount(profile.profileId, profile.sessions) > 0) {
        <span class="rv-profile__paused">runtime paused</span>
        }
      </button>
    </li>
    }
  </ul>
  }

  <button
    type="button"
    class="rv-profiles__refresh"
    data-testid="profile-refresh"
    (click)="onRefresh()"
  >
    Refresh
  </button>
</div>
