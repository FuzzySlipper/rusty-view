<button
  type="button"
  class="rv-status"
  data-testid="stream-status"
  [attr.data-stream-status]="status()"
  [class]="statusClass()"
  (click)="reconnect.emit()"
  [title]="'Click to reconnect'"
>
  <span class="rv-status__dot"></span>
  <span class="rv-status__label">{{ label() }}</span>
</button>
