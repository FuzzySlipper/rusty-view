name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format / lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full local gate: prettier check, lint (incl. module-boundary +
      # forbidden-pattern rules), per-project tsc typecheck, unit tests, build.
      - name: Format / lint / typecheck / test / build
        run: pnpm run ci

  e2e:
    name: Playwright smoke (debug-chat)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug-chat
        run: pnpm exec nx build debug-chat

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run debug-chat e2e (chromium)
        run: pnpm exec nx e2e debug-chat-e2e -- --project=chromium
